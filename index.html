<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식사정산</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

input[type="number"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 5px;
    box-sizing: border-box;
}

.person {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.left-group {
    display: flex;
    align-items: center;
}

.result {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    margin-top: 10px;
}

/* 동그라미 삭제 버튼 */
.delete-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ff3b30;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    border: none;
}
</style>
</head>

<body>

<div class="container">

<h1>식사정산</h1>

<div class="card">
<label>총 음식 금액 (원)</label>
<input type="number" id="totalAmount" placeholder="예: 85000" oninput="calculate()">
</div>

<div class="card">
<label>참여자 선택</label>
<div id="peopleList"></div>

<button class="add-btn" onclick="addPerson()">+ 인원 추가하기</button>
</div>

<div class="card">
<div class="result">
1인당 금액: <span id="perPerson">0</span> 원
</div>
</div>

</div>

<script>
let people = [
"정광훈","김정환","김정민","황희조","전인동","백경길","김원희","이영우","노주연","박지현",
"최지현","황혜성","이영준","이지혜","하연수"
];

function renderPeople() {
    const list = document.getElementById("peopleList");
    list.innerHTML = "";

    people.forEach((name, index) => {
        const div = document.createElement("div");
        div.className = "person";

        div.innerHTML = `
            <div class="left-group">
                <input type="checkbox" id="person${index}" onchange="calculate()">
                <label for="person${index}" style="margin-left:8px">${name}</label>
            </div>
            <button class="delete-btn" onclick="removePerson(${index})">−</button>
        `;

        list.appendChild(div);
    });
}

function calculate() {
    const total = parseInt(document.getElementById("totalAmount").value) || 0;
    let selectedCount = 0;

    people.forEach((_, index) => {
        const checkbox = document.getElementById(`person${index}`);
        if (checkbox && checkbox.checked) {
            selectedCount++;
        }
    });

    let result = 0;
    if (selectedCount > 0) {
        result = Math.ceil(total / selectedCount);
    }

    document.getElementById("perPerson").innerText = result.toLocaleString();
}

function addPerson() {
    const newName = prompt("추가할 인원 이름을 입력하세요");

    if (!newName) return;

    const trimmedName = newName.trim();

    if (trimmedName === "") {
        alert("이름을 입력하세요.");
        return;
    }

    if (people.includes(trimmedName)) {
        alert("이미 존재하는 이름입니다.");
        return;
    }

    people.push(trimmedName);
    renderPeople();
    calculate();
}

function removePerson(index) {
    people.splice(index, 1);
    renderPeople();
    calculate();
}

renderPeople();
</script>

</body>
</html>
