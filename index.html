<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식사정산</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.date {
    text-align: center;
    color: gray;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

input[type="number"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 5px;
    box-sizing: border-box;
}

.person {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.left-group {
    display: flex;
    align-items: center;
}

.result {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
}

.sub-info {
    font-size: 14px;
    color: gray;
    margin-top: 5px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    margin-top: 10px;
}

.delete-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ff3b30;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    border: none;
}
</style>
</head>

<body>

<div class="container">

<h1>식사정산</h1>
<div class="date" id="todayDate"></div>

<div class="card">
<label>총 음식 금액 (원)</label>
<input type="number" id="totalAmount" placeholder="예: 85000">
</div>

<div class="card">
<label>참여자 선택</label>
<div id="peopleList"></div>

<button class="add-btn" onclick="addPerson()">+ 인원 추가하기</button>
</div>

<div class="card">
<div class="result">
1인당 금액: <span id="perPerson">0</span> 원
<div class="sub-info">
(<span id="selectedCount">0</span> / <span id="totalCount">0</span> 명 참여)
</div>
</div>
</div>

</div>

<script>
const defaultPeople = [
"A","B","C","D","E","F","G","H","I","J",
"K","L","M","N","O","P","Q","R","S"
];

let people = JSON.parse(localStorage.getItem("people")) || defaultPeople;
let checkedState = JSON.parse(localStorage.getItem("checkedState")) || {};
let savedAmount = localStorage.getItem("totalAmount") || "";

document.getElementById("totalAmount").value = savedAmount;

// 📅 오늘 날짜 표시
function setTodayDate() {
    const today = new Date();
    const formatted = today.getFullYear() + "년 " +
        (today.getMonth()+1) + "월 " +
        today.getDate() + "일";
    document.getElementById("todayDate").innerText = formatted;
}

function saveData() {
    localStorage.setItem("people", JSON.stringify(people));
    localStorage.setItem("checkedState", JSON.stringify(checkedState));
    localStorage.setItem("totalAmount", document.getElementById("totalAmount").value);
}

function renderPeople() {
    const list = document.getElementById("peopleList");
    list.innerHTML = "";

    people.forEach((name, index) => {
        const div = document.createElement("div");
        div.className = "person";

        const isChecked = checkedState[name] || false;

        div.innerHTML = `
            <div class="left-group">
                <input type="checkbox" id="person${index}" ${isChecked ? "checked" : ""}>
                <label for="person${index}" style="margin-left:8px">${name}</label>
            </div>
            <button class="delete-btn" onclick="removePerson(${index})">−</button>
        `;

        list.appendChild(div);

        document.getElementById(`person${index}`).addEventListener("change", function() {
            checkedState[name] = this.checked;
            saveData();
            calculate();
        });
    });

    document.getElementById("totalCount").innerText = people.length;
}

function calculate() {
    const total = parseInt(document.getElementById("totalAmount").value) || 0;
    let selectedCount = 0;

    people.forEach(name => {
        if (checkedState[name]) selectedCount++;
    });

    let result = 0;
    if (selectedCount > 0) {
        result = Math.ceil(total / selectedCount);
    }

    document.getElementById("perPerson").innerText = result.toLocaleString();
    document.getElementById("selectedCount").innerText = selectedCount;
    saveData();
}

function addPerson() {
    const newName = prompt("추가할 인원 이름을 입력하세요");
    if (!newName) return;

    const trimmed = newName.trim();
    if (trimmed === "") {
        alert("이름을 입력하세요.");
        return;
    }

    if (people.includes(trimmed)) {
        alert("이미 존재하는 이름입니다.");
        return;
    }

    people.push(trimmed);
    checkedState[trimmed] = false;
    saveData();
    renderPeople();
    calculate();
}

function removePerson(index) {
    const name = people[index];
    delete checkedState[name];
    people.splice(index, 1);
    saveData();
    renderPeople();
    calculate();
}

document.getElementById("totalAmount").addEventListener("input", calculate);

setTodayDate();
renderPeople();
calculate();
</script>

</body>
</html>
